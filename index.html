<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CelApp</title>

  <link rel="manifest" href="/CelApp/manifest.json">
  
  <!-- Hojas de estilo del sistema -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/dock.css">
  <link rel="stylesheet" href="./css/cards.css">
  <link rel="stylesheet" href="./css/modals.css">
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;">

  <!-- Dock Superior (Barra fija superior gestionada por js/components/header.js) -->
  <header id="main-header" class="top-nav-dock"></header>

  <!-- Contenedor principal para las vistas de la aplicación -->
  <main id="app"></main>

  <!-- Dock Inferior (Barra fija inferior gestionada por js/components/dock.js) -->
  <footer id="dock-container"></footer>

  <!-- Punto de entrada principal en JavaScript (ES6 Modules) -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
